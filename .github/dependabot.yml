version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend/walletledger"
    schedule:
      interval: "weekly"
    groups:
      maven-minor-patch:
        update-types: [ "minor", "patch" ]
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: [ "minor", "patch" ]
    commit-message:
      prefix: "chore"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: [ "minor", "patch" ]
    commit-message:
      prefix: "chore"
